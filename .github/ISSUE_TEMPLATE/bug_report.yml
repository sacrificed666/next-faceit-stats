name: 🐞 Bug report
description: Something does not work as expected
title: "🐞 "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem! Please check the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: 📝 What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      placeholder: |
        1. Open the squad overview
        2. Choose the last 50 matches
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: 🗺️ Where does it happen?
      options:
        - Squad overview
        - Player page
        - Open Graph image or search result
        - Setup or deployment
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 🏷️ Version
      description: Shown in the footer of the app.
      placeholder: v1.0.0
  - type: input
    id: environment
    attributes:
      label: 💻 Browser and device
      placeholder: Chrome 140 on Windows 11, Safari on iPhone 17…
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 📎 Screenshots or extra context
