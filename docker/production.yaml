# Production build, served behind a reverse proxy that terminates TLS
name: faceit-stats-production

services:
  app:
    image: faceit-stats:production
    build:
      target: runtime
      args:
        APP_ENV: production
      secrets:
        - env
    env_file: .env.production
    environment:
      APP_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  env:
    file: .env.production
